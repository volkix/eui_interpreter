  <text x="75" y="75" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8">10G OPTICAL FIBER SWITCH</text>
  <!-- SFP+ Ports 1 to 8 -->
  <g fill="#020617" stroke="#64748b" stroke-width="1.5">
    <rect x="75" y="100" width="24" height="30" rx="2"/>
    <rect x="105" y="100" width="24" height="30" rx="2"/>
    <rect x="135" y="100" width="24" height="30" rx="2"/>
    <rect x="165" y="100" width="24" height="30" rx="2"/>
    <rect x="205" y="100" width="24" height="30" rx="2"/>
    <rect x="235" y="100" width="24" height="30" rx="2"/>
    <rect x="265" y="100" width="24" height="30" rx="2"/>
    <rect x="295" y="100" width="24" height="30" rx="2"/>
  </g>
  <!-- Port LEDs -->
  <circle cx="87" cy="92" r="3" fill="#22c55e"/>
  <circle cx="117" cy="92" r="3" fill="#22c55e"/>
  <circle cx="147" cy="92" r="3" fill="#22c55e"/>
  <circle cx="177" cy="92" r="3" fill="#38bdf8"/>
  <circle cx="217" cy="92" r="3" fill="#22c55e"/>
  <circle cx="247" cy="92" r="3" fill="#eab308"/>
  <circle cx="277" cy="92" r="3" fill="#22c55e"/>
  <circle cx="307" cy="92" r="3" fill="#22c55e"/>
  <!-- Fiber Optic Line graphic -->
  <path d="M75 155 Q 200 135 325 155" stroke="#06b6d4" stroke-width="3" fill="none"/>
  <text x="120" y="175" font-family="monospace" font-size="11" fill="#94a3b8">SPEED: 10 Gbps FULL-DUPLEX</text>
</svg>
