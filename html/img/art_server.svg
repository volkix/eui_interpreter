<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="rackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="unitGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="8" fill="#0b1120"/>
  <!-- Server Rack Frame -->
  <rect x="80" y="20" width="240" height="200" rx="4" fill="url(#rackGrad)" stroke="#38bdf8" stroke-width="2"/>
  <rect x="90" y="30" width="220" height="180" rx="2" fill="#020617"/>
  <!-- Rack Units 1 to 4 -->
  <g id="units">
    <!-- Unit 1 -->
    <rect x="96" y="38" width="208" height="34" rx="2" fill="url(#unitGrad)" stroke="#1e293b"/>
    <circle cx="112" cy="55" r="4" fill="#22c55e"/>
    <circle cx="126" cy="55" r="4" fill="#38bdf8"/>
    <rect x="144" y="46" width="90" height="18" rx="2" fill="#0f172a"/>
    <text x="148" y="59" font-family="monospace" font-size="10" fill="#38bdf8">SYS-SRV-42HE</text>
    <rect x="246" y="48" width="50" height="14" fill="#1e293b"/>
    <!-- Unit 2 -->
    <rect x="96" y="78" width="208" height="34" rx="2" fill="url(#unitGrad)" stroke="#1e293b"/>
    <circle cx="112" cy="95" r="4" fill="#22c55e"/>
    <circle cx="126" cy="95" r="4" fill="#eab308"/>
    <rect x="144" y="86" width="90" height="18" rx="2" fill="#0f172a"/>
    <text x="148" y="99" font-family="monospace" font-size="10" fill="#22c55e">CPU: 24% RAM: 48G</text>
    <rect x="246" y="88" width="50" height="14" fill="#1e293b"/>
    <!-- Unit 3 -->
    <rect x="96" y="118" width="208" height="34" rx="2" fill="url(#unitGrad)" stroke="#1e293b"/>
    <circle cx="112" cy="135" r="4" fill="#22c55e"/>
    <circle cx="126" cy="135" r="4" fill="#22c55e"/>
    <rect x="144" y="126" width="90" height="18" rx="2" fill="#0f172a"/>
    <text x="148" y="139" font-family="monospace" font-size="10" fill="#38bdf8">NVMe-STORAGE 16TB</text>
    <!-- Unit 4 -->
    <rect x="96" y="158" width="208" height="34" rx="2" fill="url(#unitGrad)" stroke="#1e293b"/>
    <circle cx="112" cy="175" r="4" fill="#22c55e"/>
    <circle cx="126" cy="175" r="4" fill="#38bdf8"/>
    <rect x="144" y="166" width="90" height="18" rx="2" fill="#0f172a"/>
    <text x="148" y="179" font-family="monospace" font-size="10" fill="#a855f7">MANAGEMENT IP</text>
  </g>
</svg>
