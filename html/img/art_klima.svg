<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <rect width="400" height="240" rx="8" fill="#0b1120"/>
  <!-- AC Unit Body -->
  <rect x="80" y="30" width="240" height="180" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <!-- Fan circle -->
  <circle cx="150" cy="120" r="50" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
  <!-- Fan blades -->
  <path d="M 150 120 L 150 75 Q 165 95 150 120" fill="#38bdf8"/>
  <path d="M 150 120 L 195 120 Q 175 135 150 120" fill="#38bdf8"/>
  <path d="M 150 120 L 150 165 Q 135 145 150 120" fill="#38bdf8"/>
  <path d="M 150 120 L 105 120 Q 125 105 150 120" fill="#38bdf8"/>
  <circle cx="150" cy="120" r="12" fill="#0f172a" stroke="#38bdf8"/>
  <!-- Digital Thermostat Display -->
  <rect x="220" y="70" width="85" height="50" rx="4" fill="#082f49" stroke="#38bdf8"/>
  <text x="232" y="98" font-family="monospace" font-size="20" font-weight="bold" fill="#38bdf8">20.5°</text>
  <text x="232" y="112" font-family="monospace" font-size="9" fill="#7dd3fc">RZ TARGET</text>
  <text x="220" y="145" font-family="monospace" font-size="11" fill="#22c55e">FAN: AUTO 65%</text>
  <text x="220" y="165" font-family="monospace" font-size="11" fill="#94a3b8">KLIMA-RZ 12kW</text>
</svg>
