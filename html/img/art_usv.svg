<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <rect width="400" height="240" rx="8" fill="#0b1120"/>
  <!-- UPS Case -->
  <rect x="70" y="30" width="260" height="180" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <!-- Front LCD Screen -->
  <rect x="100" y="55" width="200" height="75" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
  <text x="115" y="80" font-family="monospace" font-size="14" font-weight="bold" fill="#34d399">USV 3000VA SMART</text>
  <text x="115" y="102" font-family="monospace" font-size="12" fill="#6ee7b7">BATTERY: 100% [ONLINE]</text>
  <text x="115" y="120" font-family="monospace" font-size="11" fill="#a7f3d0">LOAD: 420W | RUNTIME: 48m</text>
  <!-- Buttons & LEDs -->
  <circle cx="115" cy="165" r="8" fill="#22c55e"/>
  <text x="130" y="170" font-family="monospace" font-size="12" fill="#94a3b8">POWER OK</text>
  <circle cx="215" cy="165" r="8" fill="#38bdf8"/>
  <text x="230" y="170" font-family="monospace" font-size="12" fill="#94a3b8">ECO MODE</text>
  <!-- Air vent lines -->
  <line x1="100" y1="190" x2="300" y2="190" stroke="#334155" stroke-width="2"/>
  <line x1="100" y1="196" x2="300" y2="196" stroke="#334155" stroke-width="2"/>
</svg>
